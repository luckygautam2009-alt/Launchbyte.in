services:
  - type: web
    name: launchbyte-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: REQUIRE_LOGIN_TO_EXPLORE
        value: "true"
      - key: APP_NAME
        value: LaunchByte Backend
      - key: SECRET_KEY
        generateValue: true
      - key: QR_SIGNING_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://launchbyte.vercel.app,https://launchbyte.io,https://www.launchbyte.io"
      - key: FRONTEND_URL
        value: https://launchbyte.io
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: media
      - key: EMAIL_BACKEND
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
