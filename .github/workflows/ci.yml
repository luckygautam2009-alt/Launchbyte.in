name: LaunchByte CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test:
    name: Backend Test, Migration & Schema Drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Verify Migration Integrity & Zero Drift
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          ENV: "test"
          PYTHONPATH: "."
        run: |
          alembic upgrade head
          alembic check
          rm -f ci_test.db

      - name: Run Pytest Suite
        env:
          ENV: "test"
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-insecure-test-secret-key-must-be-long-enough-32bytes"
          QR_SIGNING_KEY: "ci-qr-test-secret-key-must-be-long-enough-32bytes"
          PYTHONPATH: "."
        run: |
          python -m pytest -v

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
        run: npm run build
